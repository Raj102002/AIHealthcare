services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production

  # Optional local Redis for the caching upgrade path described in
  # docs/deployment.md and lib/cache.ts. Not required to run the app — the
  # cache falls back to an in-memory store when REDIS_URL isn't set. Uncomment
  # and set REDIS_URL=redis://redis:6379 in .env.local to use it.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
